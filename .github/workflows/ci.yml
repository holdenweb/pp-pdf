# Test on every push to main and every pull request.
#
# publish.yml runs pytest too, but only when a release tag is pushed -- the most
# expensive moment to find one failing. This runs it while a fix is cheap. No
# mypy step: unlike its sibling apps this repo does not configure mypy.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same ref makes an in-flight run pointless; drop it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Tests
        run: uv run pytest -q
